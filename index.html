<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCM Groupe VICRA</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172b4d}header{background:#102b4e;color:white;padding:24px}main{max-width:900px;margin:35px auto;padding:0 18px}.card{background:white;border-radius:12px;padding:24px;margin:16px 0;box-shadow:0 3px 12px #0001}button{background:#1765ac;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.45}label{display:block;padding:9px;border:1px solid #dce3ed;border-radius:7px;margin:7px 0}small{color:#576779}.ok{color:green}.bad{color:#a21d1d}</style></head><body><header><h1>GROUPE VICRA · QCM</h1><div>Prototype pédagogique — démonstration sans comptes utilisateurs</div></header><main><section class="card"><h2>Bienvenue</h2><p>Première version de votre application. Choisissez une formation pour essayer un QCM de démonstration.</p><select id="course"><option>TFP APS</option><option>SSIAP 1</option><option>SSIAP 2</option><option>SSIAP 3</option></select> <button id="start">Commencer</button></section><div id="quiz"></div></main><script>
const questions=[{q:'Quel organisme délivre la carte professionnelle des agents de sécurité privée ?',a:['CNAPS','SDIS','INRS'],c:0,e:'Le CNAPS délivre les cartes professionnelles dans les conditions réglementaires.'},{q:'À quoi sert une main courante ?',a:['À noter les faits et interventions','À établir les bulletins de paie','À remplacer le registre de sécurité'],c:0,e:'Elle permet une traçabilité chronologique des événements et actions.'},{q:'Quelle action doit être effectuée en priorité lors de la découverte d’un incendie ?',a:['Ignorer le départ de feu','Donner l’alerte selon les consignes','Attendre la fin de la ronde'],c:1,e:'Il faut donner l’alerte et appliquer les consignes de sécurité.'}];
const target=document.querySelector('#quiz');document.querySelector('#start').onclick=()=>{target.innerHTML='<form class="card"><h2>QCM de démonstration</h2>'+questions.map((x,i)=>'<fieldset style="border:0;margin-bottom:20px"><legend><strong>'+(i+1)+'. '+x.q+'</strong></legend>'+x.a.map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+'</label>').join('')+'</fieldset>').join('')+'<button type="submit">Corriger mon QCM</button></form>';target.querySelector('form').onsubmit=e=>{e.preventDefault();let score=0;const feedback=questions.map((q,i)=>{let answer=target.querySelector('input[name="q'+i+'"]:checked');let good=answer&&Number(answer.value)===q.c;if(good)score++;return '<p class="'+(good?'ok':'bad')+'">Question '+(i+1)+' : '+(good?'Bonne réponse':'Réponse incorrecte ou absente')+'. '+q.e+'</p>'}).join('');target.innerHTML='<div class="card"><h2>Résultat : '+score+'/'+questions.length+' ('+Math.round(score/questions.length*20*100)/100+'/20)</h2>'+feedback+'<p><small>Résultat affiché uniquement sur cet appareil, non enregistré.</small></p><button onclick="location.reload()">Recommencer</button></div>'}};
</script></body></html>
